name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip pytest build

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m pytest

      - name: Build distribution artifacts
        run: python -m build

      - name: Verify wheel in an isolated environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/safecodeloop-smoke"
          "$RUNNER_TEMP/safecodeloop-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/safecodeloop-smoke/bin/safecodeloop" --help
          "$RUNNER_TEMP/safecodeloop-smoke/bin/safecodeloop" demo main-contribution --output-dir "$RUNNER_TEMP/safecodeloop-demo"
