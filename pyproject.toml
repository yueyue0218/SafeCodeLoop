[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safecodeloop"
version = "0.1.0"
description = "A minimal coding agent harness with guardrails and feedback loops."
requires-python = ">=3.11"

[project.scripts]
safecodeloop = "safecodeloop.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
